# Build KNIFE / Docusaurus site and publish it to GitHub Pages.
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
# Requires: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publishing/docusaurus/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: publishing/docusaurus

      # make build = sync content/docs -> publishing/docusaurus/docs (rsync), then docusaurus build
      - name: Build site
        run: |
          make build \
            SITE_URL="https://${{ github.repository_owner }}.github.io" \
            BASE_URL="/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publishing/docusaurus/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
